name: Deploy Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-hostinger.yml"

concurrency:
  group: deploy-hostinger
  # Never interrupt a deployment while files or migrations may be changing.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: skuggle.royalgatewayadmin.com
  PHP_VERSION: "8.3"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, ctype, fileinfo, openssl, tokenizer, xml, curl, zip, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        env:
          APP_ENV: local
          STORAGE_LOCAL_ALLOWED: true
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test backend
        working-directory: backend
        env:
          APP_ENV: testing
          STORAGE_LOCAL_ALLOWED: true
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          vendor/bin/pint --test
          php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Test frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend
        env:
          VITE_APP_NAME: Skuggle
          VITE_ENVIRONMENT: production
          VITE_SUPPORT_EMAIL: support@skuggle.com
          VITE_LIVE_API: "true"
          VITE_API_URL: /api/v1
          VITE_CSRF_URL: /sanctum/csrf-cookie
          APP_URL: https://skuggle.royalgatewayadmin.com
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, tokenizer, xml, curl, zip, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Validate Composer lock
        working-directory: backend
        env:
          APP_ENV: local
          STORAGE_LOCAL_ALLOWED: true
        run: composer validate --no-check-publish

      - name: Install production Composer dependencies
        working-directory: backend
        env:
          APP_ENV: local
          STORAGE_LOCAL_ALLOWED: true
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Package release
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/skuggle-stage"
          mkdir -p "$STAGE/application" "$STAGE/public_html"

          rsync -a \
            --exclude node_modules \
            --exclude .git \
            --exclude tests \
            --exclude load-tests \
            --exclude storage/logs \
            --exclude 'storage/framework/cache/**' \
            --exclude 'storage/framework/sessions/**' \
            --exclude 'storage/framework/views/**' \
            --exclude 'bootstrap/cache/**' \
            --exclude .env \
            --exclude .env.* \
            backend/ "$STAGE/application/"

          mkdir -p \
            "$STAGE/application/storage/app/public" \
            "$STAGE/application/storage/framework/cache" \
            "$STAGE/application/storage/framework/sessions" \
            "$STAGE/application/storage/framework/views" \
            "$STAGE/application/storage/logs" \
            "$STAGE/application/bootstrap/cache"

          rsync -a --exclude 'server.cjs*' dist/ "$STAGE/public_html/"
          cp backend/deploy/shared-hosting/public_html/index.php "$STAGE/public_html/index.php"
          cp backend/deploy/shared-hosting/public_html/.htaccess "$STAGE/public_html/.htaccess"
          cp backend/deploy/shared-hosting/remote-release.sh "$STAGE/application/remote-release.sh"
          chmod +x "$STAGE/application/remote-release.sh"

          tar -C "$STAGE" -czf "${RUNNER_TEMP}/skuggle-release.tar.gz" application public_html
          (cd "${RUNNER_TEMP}" && sha256sum skuggle-release.tar.gz > skuggle-release.tar.gz.sha256)
          ls -lh "${RUNNER_TEMP}/skuggle-release.tar.gz"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing secret HOSTINGER_SSH_KEY (OpenSSH private key)}"
          HOST="${SSH_HOST:-147.93.54.101}"
          PORT="${SSH_PORT:-65002}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          # Retry keyscan — Hostinger shared SSH can be briefly unreachable from Actions IPs.
          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName ${HOST}
            Port ${PORT}
            User ${{ secrets.HOSTINGER_SSH_USER }}
            IdentityFile ~/.ssh/hostinger_key
            # Hostinger blocks ssh-keyscan from some GitHub runner IP ranges.
            # Trust the first key received by this isolated ephemeral runner.
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ConnectionAttempts 5
            ServerAliveInterval 15
            ServerAliveCountMax 6
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config
          # Open one persistent control socket so later scp/ssh reuse the TCP session.
          for i in 1 2 3 4 5; do
            if ssh -fN hostinger; then
              echo "SSH control master is up"
              exit 0
            fi
            echo "SSH master connect attempt $i failed; retrying..."
            sleep $((i * 4))
          done
          echo "Could not open SSH control master to Hostinger"
          exit 1

      - name: Upload + release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DB_DATABASE: ${{ secrets.HOSTINGER_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.HOSTINGER_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          APP_KEY: ${{ secrets.HOSTINGER_APP_KEY }}
          MAIL_USERNAME: ${{ secrets.HOSTINGER_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.HOSTINGER_MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.HOSTINGER_MAIL_FROM }}
          MAIL_SMOKE_TO: ${{ secrets.HOSTINGER_MAIL_SMOKE_TO }}
        run: |
          set -euo pipefail
          USER="${SSH_USER:-u237094395}"
          DOMAIN_ROOT="/home/${USER}/domains/skuggle.royalgatewayadmin.com"
          APP_DIR="${DOMAIN_ROOT}/application"
          PUBLIC_DIR="${DOMAIN_ROOT}/public_html"
          SSH=(ssh hostinger)
          SCP=(scp -O)

          if [[ -z "${MAIL_USERNAME:-}" || -z "${MAIL_PASSWORD:-}" ]]; then
            echo "ERROR: Set GitHub production secrets HOSTINGER_MAIL_USERNAME and HOSTINGER_MAIL_PASSWORD."
            exit 1
          fi

          RELEASE_ENV="${RUNNER_TEMP}/skuggle.release.env"
          umask 077
          {
            printf 'APP_DIR=%s\n' "$APP_DIR"
            printf 'PUBLIC_DIR=%s\n' "$PUBLIC_DIR"
            printf 'PHP_BIN=%s\n' '/opt/alt/php83/usr/bin/php'
            printf 'APP_URL=%s\n' 'https://skuggle.royalgatewayadmin.com'
            printf 'FRONTEND_URL=%s\n' 'https://skuggle.royalgatewayadmin.com'
            printf 'MAIL_LINK_URL=%s\n' 'https://skuggle.royalgatewayadmin.com'
            printf 'MAIL_MAILER=%s\n' 'smtp'
            printf 'MAIL_HOST=%s\n' 'smtp.hostinger.com'
            printf 'MAIL_PORT=%s\n' '465'
            printf 'MAIL_SCHEME=%s\n' 'smtps'
            printf 'MAIL_ENCRYPTION=%s\n' 'ssl'
            printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD"
            printf 'MAIL_FROM_ADDRESS=%s\n' "${MAIL_FROM_ADDRESS:-info@skuggle.royalgatewayadmin.com}"
            printf 'MAIL_FROM_NAME=%s\n' 'Skuggle'
            printf 'MAIL_CONTACT_TO=%s\n' "${MAIL_FROM_ADDRESS:-info@skuggle.royalgatewayadmin.com}"
            printf 'MAIL_SMOKE_TO=%s\n' "${MAIL_SMOKE_TO:-}"
            printf 'SEED_DEMO_TENANT=%s\n' 'true'
          } > "$RELEASE_ENV"

          # Hostinger's shared SSH transport occasionally completes SCP with a
          # corrupted large archive. Verify remotely and retry before release.
          uploaded=false
          for attempt in 1 2 3 4; do
            "${SCP[@]}" "${RUNNER_TEMP}/skuggle-release.tar.gz" "hostinger:/home/${USER}/skuggle-release.tar.gz"
            "${SCP[@]}" "${RUNNER_TEMP}/skuggle-release.tar.gz.sha256" "hostinger:/home/${USER}/skuggle-release.tar.gz.sha256"
            if "${SSH[@]}" "cd /home/${USER} && sha256sum -c skuggle-release.tar.gz.sha256"; then
              uploaded=true
              break
            fi
            echo "Release checksum mismatch after upload attempt ${attempt}; retrying..."
          done
          if [[ "$uploaded" != true ]]; then
            echo "Release upload remained corrupt after 4 attempts"
            exit 1
          fi
          "${SCP[@]}" "$RELEASE_ENV" "hostinger:/tmp/skuggle.release.env"
          rm -f "$RELEASE_ENV"

          # One remote session: extract, apply SMTP from scp'd env file, release.
          "${SSH[@]}" bash -s <<'REMOTE'
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /tmp/skuggle.release.env
          set +a
          rm -f /tmp/skuggle.release.env

          DOMAIN_ROOT="$(dirname "$APP_DIR")"
          STAMP="$(date +%Y%m%d%H%M%S)"
          STAGE="$DOMAIN_ROOT/.release-$STAMP"
          BACKUP="$HOME/backups/skuggle-$STAMP"
          mkdir -p "$DOMAIN_ROOT" "$HOME/backups" "$STAGE" "$BACKUP"
          cd "$HOME"
          sha256sum -c skuggle-release.tar.gz.sha256
          tar -xzf skuggle-release.tar.gz -C "$STAGE"
          test -f "$STAGE/application/artisan"
          test -f "$STAGE/public_html/index.html"

          if [[ -f "$APP_DIR/.env" ]]; then
            cp "$APP_DIR/.env" "$STAGE/application/.env"
          fi
          if [[ -d "$PUBLIC_DIR/assets" ]]; then
            mkdir -p "$STAGE/public_html/assets"
            cp -an "$PUBLIC_DIR/assets/." "$STAGE/public_html/assets/"
          fi
          test -f "$STAGE/application/.env"

          activated=0
          rollback() {
            rc=$?
            trap - EXIT
            if [[ "$activated" -eq 1 ]]; then
              rm -rf "$APP_DIR" "$PUBLIC_DIR"
              [[ -d "$BACKUP/application" ]] && mv "$BACKUP/application" "$APP_DIR"
              [[ -d "$BACKUP/public_html" ]] && mv "$BACKUP/public_html" "$PUBLIC_DIR"
            fi
            rm -rf "$STAGE"
            exit "$rc"
          }
          trap rollback EXIT

          [[ -d "$APP_DIR" ]] && mv "$APP_DIR" "$BACKUP/application"
          [[ -d "$PUBLIC_DIR" ]] && mv "$PUBLIC_DIR" "$BACKUP/public_html"
          activated=1
          mv "$STAGE/application" "$APP_DIR"
          mv "$STAGE/public_html" "$PUBLIC_DIR"
          chmod +x "$APP_DIR/remote-release.sh"

          if [[ ! -f "$APP_DIR/.env" ]]; then
            echo "Missing $APP_DIR/.env after extract — create it on the host or set Hostinger env secrets for first boot."
            exit 1
          fi

          export APP_DIR PUBLIC_DIR PHP_BIN
          export APP_URL FRONTEND_URL MAIL_LINK_URL
          export MAIL_MAILER MAIL_HOST MAIL_PORT MAIL_SCHEME MAIL_ENCRYPTION
          export MAIL_USERNAME MAIL_PASSWORD MAIL_FROM_ADDRESS MAIL_FROM_NAME MAIL_CONTACT_TO MAIL_SMOKE_TO
          export SEED_DEMO_TENANT
          bash "$APP_DIR/remote-release.sh"
          activated=0
          trap - EXIT
          rm -rf "$STAGE"
          rm -f "$HOME/skuggle-release.tar.gz" "$HOME/skuggle-release.tar.gz.sha256"
          REMOTE

          ssh -O exit hostinger 2>/dev/null || true

      - name: Health check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/health.json -w "%{http_code}" "https://skuggle.royalgatewayadmin.com/ready" || true)
            echo "Attempt $i => HTTP $code"
            if [[ "$code" == "200" ]]; then
              cat /tmp/health.json || true
              exit 0
            fi
            # Hostinger's CDN intermittently challenges GitHub-hosted runner IPs.
            # When that exact edge response appears, verify /ready from the
            # Hostinger account itself so a healthy release is not marked failed.
            if [[ "$code" == "403" ]] && grep -q '/hcdn-cgi/jschallenge' /tmp/health.json; then
              echo "Hostinger CDN challenged the runner; checking from the origin account"
              remote_code=$(ssh hostinger \
                "curl --connect-timeout 10 --max-time 20 -sS -o /tmp/skuggle-ready.json -w '%{http_code}' 'https://skuggle.royalgatewayadmin.com/ready'" || true)
              echo "Origin-side check => HTTP $remote_code"
              if [[ "$remote_code" == "200" ]]; then
                ssh hostinger "cat /tmp/skuggle-ready.json; rm -f /tmp/skuggle-ready.json"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Health check failed"
          cat /tmp/health.json || true
          exit 1
