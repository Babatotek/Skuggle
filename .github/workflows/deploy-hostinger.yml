name: Deploy Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/deploy-hostinger.ps1"
      - ".github/workflows/deploy-hostinger.yml"

concurrency:
  group: deploy-hostinger
  # Never interrupt a deployment while files or migrations may be changing.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: skuggle.royalgatewayadmin.com
  PHP_VERSION: "8.3"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, ctype, fileinfo, openssl, tokenizer, xml, curl, zip, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        env:
          APP_ENV: local
          STORAGE_LOCAL_ALLOWED: true
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test backend
        working-directory: backend
        env:
          APP_ENV: testing
          STORAGE_LOCAL_ALLOWED: true
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          vendor/bin/pint --test
          php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Test frontend
        run: |
          npm ci
          npm run lint
          npm run test:architecture
          npm test
          npm run build

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release identity
        id: release
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=12 HEAD)"
          ID="$(date -u +%Y%m%d-%H%M%S)-${SHA}"
          echo "id=${ID}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release ${ID}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend
        env:
          VITE_APP_NAME: Skuggle
          VITE_ENVIRONMENT: production
          VITE_SUPPORT_EMAIL: support@skuggle.com
          VITE_LIVE_API: "true"
          VITE_API_URL: /api/v1
          VITE_CSRF_URL: /sanctum/csrf-cookie
          VITE_BUILD_ID: ${{ steps.release.outputs.id }}
          VITE_GIT_SHA: ${{ steps.release.outputs.sha }}
          APP_URL: https://skuggle.royalgatewayadmin.com
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -d dist/assets
          find dist/assets -name '*.js' | grep -q .

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, tokenizer, xml, curl, zip, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Validate Composer lock
        working-directory: backend
        env:
          APP_ENV: local
          STORAGE_LOCAL_ALLOWED: true
        run: composer validate --no-check-publish

      - name: Install production Composer dependencies
        working-directory: backend
        env:
          APP_ENV: local
          STORAGE_LOCAL_ALLOWED: true
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Package release
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_SHA: ${{ steps.release.outputs.full }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/skuggle-stage"
          mkdir -p "$STAGE/application" "$STAGE/public_html"

          rsync -a \
            --exclude node_modules \
            --exclude .git \
            --exclude tests \
            --exclude load-tests \
            --exclude storage/logs \
            --exclude 'storage/framework/cache/**' \
            --exclude 'storage/framework/sessions/**' \
            --exclude 'storage/framework/views/**' \
            --exclude 'bootstrap/cache/**' \
            --exclude .env \
            --exclude .env.* \
            backend/ "$STAGE/application/"

          mkdir -p \
            "$STAGE/application/storage/app/public" \
            "$STAGE/application/storage/framework/cache" \
            "$STAGE/application/storage/framework/sessions" \
            "$STAGE/application/storage/framework/views" \
            "$STAGE/application/storage/logs" \
            "$STAGE/application/bootstrap/cache"

          rsync -a --exclude 'server.cjs*' --exclude 'server.mjs*' dist/ "$STAGE/public_html/"
          cp backend/deploy/shared-hosting/public_html/index.php "$STAGE/public_html/index.php"
          cp backend/deploy/shared-hosting/public_html/.htaccess "$STAGE/public_html/.htaccess"
          cp backend/deploy/shared-hosting/remote-release.sh "$STAGE/application/remote-release.sh"
          cp backend/deploy/shared-hosting/remote-deploy.sh "$STAGE/application/remote-deploy.sh"
          chmod +x "$STAGE/application/remote-release.sh" "$STAGE/application/remote-deploy.sh"

          cat > "$STAGE/release-manifest.json" <<EOF
          {
            "application": "skuggle",
            "release": "${RELEASE_ID}",
            "commit": "${RELEASE_SHA}",
            "branch": "${RELEASE_BRANCH}",
            "environment": "production",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "frontendBuild": "${RELEASE_ID}",
            "backendBuild": "${RELEASE_ID}"
          }
          EOF

          tar -C "$STAGE" -czf "${RUNNER_TEMP}/release.tar.gz" application public_html release-manifest.json
          (cd "${RUNNER_TEMP}" && sha256sum release.tar.gz > release.tar.gz.sha256)
          ls -lh "${RUNNER_TEMP}/release.tar.gz"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing secret HOSTINGER_SSH_KEY (OpenSSH private key)}"
          HOST="${SSH_HOST:-147.93.54.101}"
          PORT="${SSH_PORT:-65002}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          # Retry keyscan — Hostinger shared SSH can be briefly unreachable from Actions IPs.
          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName ${HOST}
            Port ${PORT}
            User ${{ secrets.HOSTINGER_SSH_USER }}
            IdentityFile ~/.ssh/hostinger_key
            # Hostinger blocks ssh-keyscan from some GitHub runner IP ranges.
            # Trust the first key received by this isolated ephemeral runner.
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ConnectionAttempts 5
            ServerAliveInterval 15
            ServerAliveCountMax 6
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config
          # Open one persistent control socket so later scp/ssh reuse the TCP session.
          for i in 1 2 3 4 5; do
            if ssh -fN hostinger; then
              echo "SSH control master is up"
              exit 0
            fi
            echo "SSH master connect attempt $i failed; retrying..."
            sleep $((i * 4))
          done
          echo "Could not open SSH control master to Hostinger"
          exit 1

      - name: Upload + release
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          APP_GIT_SHA: ${{ steps.release.outputs.sha }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DB_DATABASE: ${{ secrets.HOSTINGER_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.HOSTINGER_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          APP_KEY: ${{ secrets.HOSTINGER_APP_KEY }}
          MAIL_USERNAME: ${{ secrets.HOSTINGER_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.HOSTINGER_MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.HOSTINGER_MAIL_FROM }}
        run: |
          set -euo pipefail
          USER="${SSH_USER:-u237094395}"
          DOMAIN_ROOT="/home/${USER}/domains/skuggle.royalgatewayadmin.com"
          ARTIFACT_DIR="/home/${USER}/deployments/skuggle/artifacts/${RELEASE_ID}"
          SSH=(ssh hostinger)
          SCP=(scp -O)

          if [[ -z "${MAIL_USERNAME:-}" || -z "${MAIL_PASSWORD:-}" ]]; then
            echo "ERROR: Set GitHub production secrets HOSTINGER_MAIL_USERNAME and HOSTINGER_MAIL_PASSWORD."
            exit 1
          fi

          RELEASE_ENV="${RUNNER_TEMP}/skuggle.release.env"
          umask 077
          {
            printf 'RELEASE_ID=%q\n' "$RELEASE_ID"
            printf 'APP_RELEASE_ID=%q\n' "$RELEASE_ID"
            printf 'APP_GIT_SHA=%q\n' "$APP_GIT_SHA"
            printf 'DOMAIN_ROOT=%q\n' "$DOMAIN_ROOT"
            printf 'PHP_BIN=%q\n' '/opt/alt/php83/usr/bin/php'
            printf 'PUBLIC_HEALTH_URL=%q\n' 'https://skuggle.royalgatewayadmin.com'
            printf 'APP_URL=%q\n' 'https://skuggle.royalgatewayadmin.com'
            printf 'FRONTEND_URL=%q\n' 'https://skuggle.royalgatewayadmin.com'
            printf 'MAIL_LINK_URL=%q\n' 'https://skuggle.royalgatewayadmin.com'
            printf 'MAIL_MAILER=%q\n' 'smtp'
            printf 'MAIL_HOST=%q\n' 'smtp.hostinger.com'
            printf 'MAIL_PORT=%q\n' '465'
            printf 'MAIL_SCHEME=%q\n' 'smtps'
            printf 'MAIL_ENCRYPTION=%q\n' 'ssl'
            printf 'MAIL_USERNAME=%q\n' "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%q\n' "$MAIL_PASSWORD"
            printf 'MAIL_FROM_ADDRESS=%q\n' "${MAIL_FROM_ADDRESS:-info@skuggle.royalgatewayadmin.com}"
            printf 'MAIL_FROM_NAME=%q\n' 'Skuggle'
            printf 'MAIL_CONTACT_TO=%q\n' "${MAIL_FROM_ADDRESS:-info@skuggle.royalgatewayadmin.com}"
            printf 'SEED_DEMO_TENANT=%q\n' 'true'
          } > "$RELEASE_ENV"

          "${SSH[@]}" "mkdir -p '$ARTIFACT_DIR'"

          # Hostinger's shared SSH transport occasionally completes SCP with a
          # corrupted large archive. Verify remotely and retry before release.
          uploaded=false
          for attempt in 1 2 3 4; do
            "${SCP[@]}" "${RUNNER_TEMP}/release.tar.gz" "hostinger:${ARTIFACT_DIR}/release.tar.gz"
            "${SCP[@]}" "${RUNNER_TEMP}/release.tar.gz.sha256" "hostinger:${ARTIFACT_DIR}/release.tar.gz.sha256"
            if "${SSH[@]}" "cd '$ARTIFACT_DIR' && sha256sum -c release.tar.gz.sha256"; then
              uploaded=true
              break
            fi
            echo "Release checksum mismatch after upload attempt ${attempt}; retrying..."
          done
          if [[ "$uploaded" != true ]]; then
            echo "Release upload remained corrupt after 4 attempts"
            exit 1
          fi
          "${SCP[@]}" "$RELEASE_ENV" "hostinger:/home/${USER}/skuggle-release.env"
          "${SCP[@]}" backend/deploy/shared-hosting/remote-deploy.sh "hostinger:/home/${USER}/skuggle-remote-deploy.sh"
          rm -f "$RELEASE_ENV"

          "${SSH[@]}" bash -s <<REMOTE
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /home/${USER}/skuggle-release.env
          set +a
          rm -f /home/${USER}/skuggle-release.env
          chmod +x /home/${USER}/skuggle-remote-deploy.sh
          bash /home/${USER}/skuggle-remote-deploy.sh
          rc=\$?
          rm -f /home/${USER}/skuggle-remote-deploy.sh
          exit \$rc
          REMOTE

          ssh -O exit hostinger 2>/dev/null || true

      - name: Health check
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          check_payload() {
            python3 -c 'import json,sys; body=json.load(open(sys.argv[1],encoding="utf-8")); expected=sys.argv[2];
          status=body.get("status"); release=body.get("release")
          assert status=="ready", "status %r is not ready" % (status,)
          assert release==expected, "release %r != %r" % (release, expected)' "$1" "$RELEASE_ID"
          }
          for i in 1 2 3 4 5 6; do
            code=$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/health.json -w "%{http_code}" "https://skuggle.royalgatewayadmin.com/ready" || true)
            echo "Attempt $i => HTTP $code"
            if [[ "$code" == "200" ]]; then
              cat /tmp/health.json || true
              if check_payload /tmp/health.json; then
                exit 0
              fi
              echo "Ready HTTP 200 but payload did not match release ${RELEASE_ID}; retrying..."
            fi
            # Hostinger's CDN intermittently challenges GitHub-hosted runner IPs.
            # When that exact edge response appears, verify /ready from the
            # Hostinger account itself so a healthy release is not marked failed.
            if [[ "$code" == "403" ]] && grep -q '/hcdn-cgi/jschallenge' /tmp/health.json; then
              echo "Hostinger CDN challenged the runner; checking from the origin account"
              remote_code=$(ssh hostinger \
                "curl --connect-timeout 10 --max-time 20 -sS -o /tmp/skuggle-ready.json -w '%{http_code}' 'https://skuggle.royalgatewayadmin.com/ready'" || true)
              echo "Origin-side check => HTTP $remote_code"
              if [[ "$remote_code" == "200" ]]; then
                ssh hostinger "cat /tmp/skuggle-ready.json"
                ssh hostinger "cat /tmp/skuggle-ready.json" > /tmp/health.json
                ssh hostinger "rm -f /tmp/skuggle-ready.json"
                check_payload /tmp/health.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Health check failed"
          cat /tmp/health.json || true
          exit 1
