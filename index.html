<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Skuggle | School Operating & Learning Intelligence Platform</title>
    <meta name="description" content="Multi-tenant School Operating and Learning Intelligence Platform for Nigerian nursery, primary, and secondary schools." />
    <meta name="skuggle-release" content="%VITE_BUILD_ID%" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/skuggleAiHero.png" as="image" type="image/png" />

    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Font loading with display=swap for better FCP -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    <style>
      #boot-status{
        position:fixed;inset:0;z-index:80;min-height:100vh;display:flex;align-items:center;justify-content:center;
        overflow:hidden;background:#FFFCF7;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;color:#475569;text-align:center;
      }
      #boot-status::before{
        content:"";position:absolute;inset:0;pointer-events:none;
        background:
          radial-gradient(ellipse 80% 60% at 50% 35%, rgba(99,102,241,.14), transparent 60%),
          radial-gradient(ellipse 70% 50% at 70% 80%, rgba(245,158,11,.12), transparent 55%),
          radial-gradient(ellipse 50% 40% at 20% 70%, rgba(139,92,246,.1), transparent 50%);
      }
      #boot-stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:24px;max-width:22rem}
      #boot-mascot-wrap{
        width:min(52vw,208px);height:min(52vw,208px);margin-bottom:1.25rem;
        animation:boot-zoom-in 1.05s cubic-bezier(.22,1,.36,1) both;
      }
      #boot-mascot{
        width:100%;height:100%;object-fit:contain;display:block;
        filter:drop-shadow(0 18px 40px rgba(67,56,202,.28));
        animation:boot-bounce 1.35s ease-in-out 1.05s infinite;
      }
      #boot-wordmark{font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;color:#0f172a;line-height:1}
      #boot-wordmark .u{color:#f59e0b}
      #boot-copy{margin:1rem 0 0;font-size:.875rem;font-weight:600;letter-spacing:-0.01em;line-height:1.5;color:#475569}
      #boot-dots{display:flex;gap:6px;margin-top:1.25rem}
      #boot-dots span{
        width:8px;height:8px;border-radius:999px;background:#6366f1;
        animation:boot-dot .9s ease-in-out infinite;
      }
      #boot-dots span:nth-child(2){animation-delay:.16s}
      #boot-dots span:nth-child(3){animation-delay:.32s}
      #boot-retry{
        display:none;width:100%;margin-top:1.25rem;padding:11px 14px;border:0;border-radius:12px;
        background:#4f46e5;color:#fff;font:inherit;font-weight:700;cursor:pointer;
      }
      @keyframes boot-zoom-in{
        0%{opacity:0;transform:translateY(36px) scale(.55)}
        35%{opacity:1;transform:translateY(-18px) scale(1.12)}
        55%{transform:translateY(8px) scale(.96)}
        78%{transform:translateY(-6px) scale(1.04)}
        100%{opacity:1;transform:translateY(0) scale(1)}
      }
      @keyframes boot-bounce{
        0%,100%{transform:translateY(0) scale(1) rotate(0deg)}
        50%{transform:translateY(-14px) scale(1.06) rotate(-2deg)}
      }
      @keyframes boot-dot{
        0%,100%{opacity:.25;transform:translateY(0) scale(.85)}
        50%{opacity:1;transform:translateY(-4px) scale(1.15)}
      }
      @media (prefers-reduced-motion:reduce){
        #boot-mascot-wrap,#boot-mascot,#boot-dots span{animation:none}
      }
    </style>
    <script>
      // Recover before React loads if an old service worker/cache still owns this tab.
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(items){items.forEach(function(item){item.unregister()})});
      if ('caches' in window) caches.keys().then(function(keys){keys.forEach(function(key){caches.delete(key)})});
      window.setTimeout(function(){var text=document.getElementById('boot-copy'),retry=document.getElementById('boot-retry');if(text){text.textContent='This is taking longer than expected. Check your connection, then retry.';retry.style.display='block'}},12000);
      window.addEventListener('error',function(event){
        var msg = (event && event.message) ? String(event.message) : '';
        var isChunk = /ChunkLoadError|Failed to fetch dynamically imported module|Importing a module script failed/i.test(msg);
        var isScript = event.target && event.target.tagName === 'SCRIPT';
        if (!isChunk && !isScript) return;
        var key = 'skuggle-vite-reload';
        if (!sessionStorage.getItem(key)) {
          sessionStorage.setItem(key, '1');
          location.reload();
          return;
        }
        var text=document.getElementById('boot-copy'),retry=document.getElementById('boot-retry');
        if(text){text.textContent='A required app file could not load. Please retry to fetch the latest version.';retry.style.display='block'}
      },true);
    </script>
    <!-- Do not modulepreload /src/main.tsx: Vite rewrites it to data:application/octet-stream in production builds, which browsers reject. -->
  </head>
  <body class="bg-[#FFFCF7] text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="boot-status" role="status" aria-live="polite" aria-busy="true" aria-label="Getting Skuggle ready">
        <div id="boot-stage">
          <div id="boot-mascot-wrap">
            <img id="boot-mascot" src="/skuggleAiHero.png" alt="" width="208" height="208" decoding="async" fetchpriority="high" />
          </div>
          <div id="boot-wordmark" aria-hidden="true">Sk<span class="u">u</span>ggle</div>
          <p id="boot-copy">Getting Skuggle ready…</p>
          <div id="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <button id="boot-retry" type="button" onclick="location.reload()">Retry loading</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
