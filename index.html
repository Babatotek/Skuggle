<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Skuggle | School Operating & Learning Intelligence Platform</title>
    <meta name="description" content="Multi-tenant School Operating and Learning Intelligence Platform for Nigerian nursery, primary, and secondary schools." />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Font loading with display=swap for better FCP -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    <style>
      #boot-status{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f0ff;font-family:Inter,system-ui,sans-serif;color:#334155}
      #boot-card{width:min(88vw,360px);padding:28px;text-align:center;background:#fff;border:1px solid #ede9fe;border-radius:24px;box-shadow:0 20px 45px rgba(76,29,149,.1)}
      #boot-mark{width:48px;height:48px;margin:0 auto 16px;display:grid;place-items:center;border-radius:16px;background:#7c3aed;color:#fff;font-size:24px;font-weight:800}
      #boot-card strong{display:block;color:#0f172a;font-size:18px;margin-bottom:7px}#boot-card p{font-size:13px;line-height:1.6;margin:0}
      #boot-retry{display:none;width:100%;margin-top:18px;padding:11px;border:0;border-radius:12px;background:#7c3aed;color:white;font-weight:700;cursor:pointer}
    </style>
    <script>
      // Recover before React loads if an old service worker/cache still owns this tab.
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(items){items.forEach(function(item){item.unregister()})});
      if ('caches' in window) caches.keys().then(function(keys){keys.forEach(function(key){caches.delete(key)})});
      window.setTimeout(function(){var text=document.getElementById('boot-copy'),retry=document.getElementById('boot-retry');if(text){text.textContent='This is taking longer than expected. Check your connection, then retry.';retry.style.display='block'}},12000);
      window.addEventListener('error',function(event){if(event.target&&event.target.tagName==='SCRIPT'){var text=document.getElementById('boot-copy'),retry=document.getElementById('boot-retry');if(text){text.textContent='A required app file could not load. Please retry to fetch the latest version.';retry.style.display='block'}}},true);
    </script>
    <!-- Do not modulepreload /src/main.tsx: Vite rewrites it to data:application/octet-stream in production builds, which browsers reject. -->
  </head>
  <body class="bg-[#FFFCF7] text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"><div id="boot-status" role="status" aria-live="polite"><div id="boot-card"><div id="boot-mark">S</div><strong>Opening Skuggle</strong><p id="boot-copy">Preparing your secure learning workspace…</p><button id="boot-retry" type="button" onclick="location.reload()">Retry loading</button></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
