<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Skuggle is offline</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffcf7;color:#0f172a;font-family:system-ui,sans-serif}
      main{max-width:32rem;padding:2rem;text-align:center}img{width:4rem;height:4rem}h1{font-size:1.5rem}p{color:#475569;line-height:1.6}button{border:0;border-radius:999px;background:#4f46e5;color:white;font-weight:700;padding:.8rem 1.25rem;cursor:pointer}
    </style>
  </head>
  <body><main><img src="/icon.svg" alt=""><h1>You’re offline</h1><p>Reconnect to continue. Skuggle never caches sensitive school actions or API responses for offline use.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
